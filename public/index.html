<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Papayu Short - Vibrant Premium Streaming</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Inter & Montserrat -->
<link rel="icon" type="image/jpg" href="pshort.jpg" />
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           VIBRANT GLASS DESIGN SYSTEM
           ========================================= */
        :root {
            --primary: #f43f5e; /* Rose Vibrant */
            --primary-gradient: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            --secondary: #8b5cf6; /* Indigo/Violet */
            --accent-glow: rgba(244, 63, 94, 0.4);
            --success: #10b981;
            --bg-body: #08070b;
            --bg-glass: rgba(20, 20, 25, 0.7);
            --bg-card: #15141b;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --radius-full: 50px;
            --radius-lg: 22px;
            --radius-md: 14px;
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Modern Navigation */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0; height: 75px;
            background: var(--bg-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center;
            padding: 0 20px; z-index: 1000;
        }

        .nav-content { width: 100%; max-width: 1500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        
        .brand { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 1.5rem; font-weight: 900; 
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        .brand span { color: white; -webkit-text-fill-color: white; opacity: 0.9; font-weight: 600; }

        /* Search Bar UI */
        .search-wrapper { flex: 1; max-width: 500px; position: relative; }
        .search-group { position: relative; display: flex; align-items: center; width: 100%; }
        .search-group input { 
            width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 12px 100px 12px 50px; border-radius: 16px; color: white; 
            font-size: 14px; transition: var(--transition);
        }
        .search-group input:focus { 
            border-color: var(--primary); background: rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.2); 
        }
        .search-icon-inside { position: absolute; left: 18px; color: var(--text-muted); width: 20px; pointer-events: none; }
        .search-btn-inside { 
            position: absolute; right: 6px; background: var(--primary-gradient); color: white; 
            border: none; padding: 7px 18px; border-radius: 12px; font-size: 11px; 
            font-weight: 800; cursor: pointer; text-transform: uppercase; 
        }

        /* Sidebar & Overlay */
        aside { 
            position: fixed; left: 0; top: 75px; bottom: 0; width: 260px; 
            background: var(--bg-body); border-right: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 30px 15px; z-index: 900; transition: transform 0.4s ease; 
        }
        
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 850; display: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .menu-item { 
            padding: 14px 18px; border-radius: 16px; color: var(--text-muted); 
            cursor: pointer; display: flex; align-items: center; gap: 15px; margin-bottom: 8px; 
            font-weight: 600; font-size: 15px; transition: var(--transition);
        }
        .menu-item i { width: 20px; }
        .menu-item:hover { background: rgba(255, 255, 255, 0.04); color: white; }
        .menu-item.active { 
            background: var(--primary-gradient); color: white; 
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        main { margin-left: 260px; padding: 105px 25px 60px; min-height: 100vh; transition: var(--transition); }
        .container { max-width: 1440px; margin: 0 auto; }

        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 35px; }
        .section-header h2 { font-weight: 800; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        .section-header .line { height: 3px; flex: 1; background: linear-gradient(to right, var(--primary), transparent); border-radius: 10px; opacity: 0.4; }

        /* DRAMA CARDS */
        .drama-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }
        .drama-card { 
            background: var(--bg-card); border-radius: var(--radius-lg); 
            overflow: hidden; cursor: pointer; transition: var(--transition); 
            position: relative; border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .drama-card:hover { 
            transform: translateY(-12px) scale(1.03); 
            border-color: var(--primary);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }
        .card-image-container { aspect-ratio: 3/4; position: relative; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s ease; }
        .drama-card:hover .card-img { transform: scale(1.1); filter: brightness(0.8); }
        
        .rating-badge { 
            position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(10px); padding: 5px 10px; border-radius: 10px; 
            font-size: 11px; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 5px; 
        }
        
        .progress-badge { 
            position: absolute; top: 12px; right: 12px; background: var(--primary-gradient); 
            color: white; padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 900;
            box-shadow: 0 5px 15px var(--accent-glow); z-index: 5;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .card-content { padding: 15px; }
        .card-title { font-size: 13px; font-weight: 800; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; height: 36px; line-height: 1.4; margin-bottom: 6px; }
        .card-info { font-size: 10px; color: var(--text-muted); font-weight: 800; letter-spacing: 0.5px; }

        /* PLAYER UI */
        #detail-view { display: none; animation: fadeIn 0.5s ease; }
        .player-container { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 24px; overflow: hidden; 
            margin-bottom: 35px; border: 1px solid rgba(255, 255, 255, 0.08); 
            position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.8); 
            user-select: none; z-index: 10;
        }

        .player-container.fullscreen { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100dvh; z-index: 5000; border-radius: 0; border: none; aspect-ratio: auto; 
        }

        #video-element { width: 100%; height: 100%; object-fit: contain; }

        .player-overlay-center { 
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.4); z-index: 15; pointer-events: none; 
            transition: opacity 0.4s ease; 
        }

        .play-ring-center { 
            width: 80px; height: 80px; background: var(--primary-gradient); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            color: white; margin-bottom: 15px; box-shadow: 0 0 40px var(--accent-glow); 
        }

        .custom-controls { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%); 
            padding: 60px 25px calc(20px + env(safe-area-inset-bottom)) 25px; 
            z-index: 20; opacity: 1; transition: opacity 0.4s ease; 
            display: flex; flex-direction: column; gap: 15px; 
        }

        .player-container.playing:not(.show-ui) .custom-controls, 
        .player-container.playing:not(.show-ui) .player-overlay-center { 
            opacity: 0; pointer-events: none; 
        }

        .progress-bar-container { 
            width: 100%; height: 6px; background: rgba(255,255,255,0.15); 
            border-radius: 10px; cursor: pointer; position: relative; transition: height 0.2s;
        }
        .progress-bar-container:hover { height: 10px; }
        .progress-fill { height: 100%; background: var(--primary-gradient); width: 0%; border-radius: 10px; box-shadow: 0 0 15px var(--primary); }

        .controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
        .controls-group { display: flex; align-items: center; gap: 18px; }

        .control-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; transition: var(--transition); }
        .control-btn:hover { color: var(--primary); transform: scale(1.15); }
        .control-btn.btn-text { 
            font-size: 11px; font-weight: 800; color: white; 
            padding: 8px 20px; background: var(--primary-gradient); 
            border-radius: 12px; white-space: nowrap; box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* EPISODE BUTTONS */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 12px; }
        .ep-btn { 
            aspect-ratio: 1/1; background: #1a1a20; border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 14px; color: var(--text-muted); font-weight: 800; 
            cursor: pointer; transition: var(--transition); font-size: 16px;
            position: relative; overflow: hidden;
        }
        .ep-btn:hover { border-color: var(--primary); color: white; }
        .ep-btn.active { 
            background: var(--primary-gradient); color: white; 
            box-shadow: 0 8px 20px var(--accent-glow); border-color: var(--primary); 
        }
        
        .check-mark {
            position: absolute; top: 4px; right: 4px; color: var(--success); 
            background: rgba(0,0,0,0.7); border-radius: 50%; width: 16px; height: 16px;
            display: none; align-items: center; justify-content: center;
        }
        .ep-btn.watched .check-mark { display: flex; }

        /* Detail Flex Layout */
        .detail-flex { display: grid; grid-template-columns: 320px 1fr; gap: 50px; }
        .detail-poster { width: 100%; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .detail-info h1 { font-size: 3rem; font-weight: 900; line-height: 1.1; margin-bottom: 20px; text-transform: uppercase; letter-spacing: -1.5px; }
        .detail-stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 30px; }
        .stat-pill { padding: 8px 20px; background: rgba(255,255,255,0.04); border-radius: 50px; font-size: 12px; font-weight: 700; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.06); }
        .description-box { background: rgba(255,255,255,0.02); padding: 25px; border-radius: 18px; font-size: 15px; line-height: 1.7; color: #cbd5e1; margin-bottom: 40px; border-left: 5px solid var(--primary); font-style: italic; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 992px) {
            aside { transform: translateX(-100%); width: 280px; background: var(--bg-body); box-shadow: 20px 0 60px rgba(0,0,0,0.8); }
            aside.active { transform: translateX(0); }
            main { margin-left: 0; padding: 95px 15px 50px; }
            .detail-flex { grid-template-columns: 1fr; gap: 30px; }
            .detail-poster { max-width: 220px; margin: 0 auto; }
            .menu-toggle { display: block !important; }
            .detail-info h1 { font-size: 2rem; text-align: center; }
            .detail-stats { justify-content: center; }
            .search-wrapper { max-width: 170px; }
            .search-btn-inside span { display: none; }
            .search-btn-inside { width: 34px; height: 34px; padding: 0; justify-content: center; }
            .drama-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        }

        .menu-toggle { display: none; cursor: pointer; color: white; background: none; border: none; margin-right: 15px; }
        
        .ep-popup { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: flex-end; backdrop-filter: blur(15px); }
        .ep-popup-content { width: 100%; max-height: 85%; background: #0c0c12; border-radius: 35px 35px 0 0; padding: 35px 24px 60px; overflow-y: auto; transform: translateY(100%); transition: transform 0.5s ease; border-top: 1px solid rgba(255,255,255,0.1); }
        .ep-popup.active { display: flex; }
        .ep-popup.active .ep-popup-content { transform: translateY(0); }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Overlay Sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Loader -->
    <div id="loader" style="position:fixed; inset:0; background:var(--bg-body); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:9000;">
        <div style="width:45px; height:45px; border:4px solid rgba(255,255,255,0.05); border-top:4px solid var(--primary); border-radius:50%; animation:spin 1s linear infinite;"></div>
        <p style="margin-top:20px; color:var(--primary); font-weight:900; letter-spacing:4px; font-size:10px; text-transform:uppercase;">Memproses</p>
    </div>

    <nav>
        <div class="nav-content">
            <div class="brand" onclick="location.reload()">
                <button class="menu-toggle" onclick="toggleSidebar(event)"><i data-lucide="menu"></i></button>
                PAPAYU <span>SHORT</span>
            </div>
            <form class="search-wrapper" onsubmit="handleSearch(event)">
                <div class="search-group">
                    <i data-lucide="search" class="search-icon-inside"></i>
                    <input type="text" id="searchInput" placeholder="Cari drama...">
                    <button type="submit" class="search-btn-inside">Cari</button>
                </div>
            </form>
        </div>
    </nav>

    <aside id="sidebar">
        <div class="menu-item active" onclick="changeSection('home', this)"><i data-lucide="home"></i> Beranda</div>
        <div class="menu-item" onclick="changeSection('trending', this)"><i data-lucide="trending-up"></i> Trending</div>
        <div class="menu-item" onclick="changeSection('latest', this)"><i data-lucide="clock"></i> Terbaru</div>
        <div class="menu-item" onclick="showHistory(this, true)"><i data-lucide="check-circle"></i> Tamat</div>
        <div class="menu-item" onclick="showHistory(this, false)"><i data-lucide="history"></i> Riwayat</div>
    </aside>

    <main>
        <div class="container">
            <!-- Grid View -->
            <div id="list-view">
                <div class="section-header">
                    <i data-lucide="zap" style="color:var(--primary); width:24px;"></i>
                    <h2 id="view-label">Drama Populer</h2>
                    <div class="line"></div>
                </div>
                <div id="drama-grid" class="drama-grid"></div>
            </div>

            <!-- Detail View -->
            <div id="detail-view">
                <div class="player-container" id="player-main">
                    <video id="video-element" playsinline webkit-playsinline preload="auto"></video>
                    <div id="player-ui-center" class="player-overlay-center">
                        <div class="play-ring-center" id="center-play-btn"><i data-lucide="play" fill="white" style="width:34px; height:34px;"></i></div>
                        <h4 id="player-drama-title" style="font-weight:900; text-transform:uppercase; text-shadow: 0 4px 15px rgba(0,0,0,1);">JUDUL DRAMA</h4>
                        <p id="player-status" style="font-size:11px; color:var(--primary); font-weight:800; letter-spacing:2px;">MENGHUBUNGKAN...</p>
                    </div>
                    <div class="custom-controls" id="custom-controls">
                        <div class="progress-bar-container" id="progress-container">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="controls-row">
                            <div class="controls-group">
                                <button class="control-btn" id="main-play-btn"><i data-lucide="play" fill="white"></i></button>
                                <button class="control-btn" onclick="prevEpisode()" id="prev-btn-ctrl" disabled title="Previous"><i data-lucide="skip-back" fill="white"></i></button>
                                <button class="control-btn" onclick="nextEpisode()" id="next-btn-ctrl" disabled title="Next"><i data-lucide="skip-forward" fill="white"></i></button>
                                <span style="font-size:11px; font-weight:800; color:#ccc;" id="time-display">00:00 / 00:00</span>
                            </div>
                            <div class="controls-group">
                                <button class="control-btn btn-text" onclick="openEpPopup()">PILIH EPISODE</button>
                                <button class="control-btn" id="full-btn"><i data-lucide="maximize"></i></button>
                            </div>
                        </div>
                    </div>
                    <div id="ep-popup" class="ep-popup" onclick="closeEpPopup()">
                        <div class="ep-popup-content" onclick="event.stopPropagation()">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                                <h3 style="color:var(--primary); font-size:16px; text-transform:uppercase; letter-spacing:2px; font-weight:900;">Daftar Episode</h3>
                                <button onclick="closeEpPopup()" style="background:rgba(255,255,255,0.05); border:none; color:#fff; padding:8px; border-radius:50%;"><i data-lucide="x"></i></button>
                            </div>
                            <div id="ep-grid-mobile" class="ep-grid"></div>
                        </div>
                    </div>
                </div>

                <div class="detail-flex">
                    <div class="detail-left">
                        <img id="det-poster" src="" class="detail-poster" onerror="this.src='https://placehold.co/400x600/18181b/ffffff?text=Cover+N/A'">
                        <button class="menu-item" style="width:100%; margin-top:35px; justify-content:center; background:#1a1a20; border:1px solid rgba(255,255,255,0.08); border-radius: 50px;" onclick="closeDetail()">
                            <i data-lucide="arrow-left"></i> JELAJAH LAGI
                        </button>
                    </div>
                    <div class="detail-right">
                        <div class="detail-info">
                            <h1 id="det-title">Judul Drama</h1>
                            <div class="detail-stats">
                                <div class="stat-pill"><i data-lucide="star" fill="#fbbf24" style="width:14px; margin-right:8px; color:#fbbf24;"></i> <span id="det-rating">9.8</span></div>
                                <div class="stat-pill"><i data-lucide="tv" style="width:14px; margin-right:6px;"></i> <span id="det-ep-count">0</span> EPISODE</div>
                                <div id="watch-progress-banner" class="stat-pill" style="color:var(--primary); font-weight:800; border-color:var(--primary); display:none;">
                                    <i data-lucide="zap" style="width:14px; margin-right:8px;"></i> <span id="watched-text">0/0</span>
                                </div>
                                <button id="btn-finish-manual" onclick="toggleFinishManual()" class="stat-pill" style="cursor:pointer; background:rgba(16, 185, 129, 0.1); border-color:var(--success); color:var(--success); display:none;">
                                    <i data-lucide="check-circle" style="width:14px; margin-right:8px;"></i> <span id="finish-status-text">Selesai</span>
                                </button>
                            </div>
                            <div class="description-box" id="det-synopsis">Memuat sinopsis...</div>
                            <div class="episodes-section">
                                <h3 style="font-size:16px; margin-bottom:25px; text-transform:uppercase; letter-spacing:2px; color:var(--primary); font-weight:900;">Pilih Episode</h3>
                                <div class="ep-grid" id="ep-grid"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /* =========================================
           STABLE CORE LOGIC
           ========================================= */
        const API_URL = 'https://dramabox-api-xi.vercel.app/api/dramabox';
        const STORAGE_KEY = 'papayu_vibrant_history';
        
        let activeDramaId = null;
        let currentEpIndex = -1;
        let totalChapters = 0;
        let uiTimeout;
        let watchHistory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        // Sidebar Navigation Fixes
        window.toggleSidebar = (e) => { 
            e.stopPropagation(); 
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('active'); 
            overlay.classList.toggle('active');
        };

        window.closeSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        };

        window.setLoader = (show) => document.getElementById('loader').style.display = show ? 'flex' : 'none';
        window.openEpPopup = () => { document.getElementById('ep-popup').style.display = 'flex'; setTimeout(() => document.getElementById('ep-popup').classList.add('active'), 10); };
        window.closeEpPopup = () => { document.getElementById('ep-popup').classList.remove('active'); setTimeout(() => document.getElementById('ep-popup').style.display = 'none', 400); };

        const video = document.getElementById('video-element');
        const playerMain = document.getElementById('player-main');
        const progressFill = document.getElementById('progress-fill');
        const timeDisplay = document.getElementById('time-display');
        const centerUI = document.getElementById('player-ui-center');

        function updatePlayIcons(isPlaying) {
            const icon = isPlaying ? 'pause' : 'play';
            document.getElementById('main-play-btn').innerHTML = `<i data-lucide="${icon}" fill="white"></i>`;
            document.getElementById('center-play-btn').innerHTML = `<i data-lucide="${icon}" fill="white" style="width:34px; height:34px;"></i>`;
            lucide.createIcons();
        }

        function showUI() {
            playerMain.classList.add('show-ui');
            clearTimeout(uiTimeout);
            if (!video.paused) uiTimeout = setTimeout(() => playerMain.classList.remove('show-ui'), 3500);
        }

        function resetPlayer() {
            video.pause(); video.oncanplay = null; video.removeAttribute('src'); video.load();
            playerMain.classList.remove('playing', 'fullscreen');
            video.style.display = 'none'; centerUI.style.display = 'flex';
            document.getElementById('player-status').innerText = "PILIH EPISODE";
            document.getElementById('prev-btn-ctrl').disabled = true;
            document.getElementById('next-btn-ctrl').disabled = true;
            currentEpIndex = -1; totalChapters = 0;
            progressFill.style.width = '0%'; timeDisplay.innerText = "00:00 / 00:00";
            updatePlayIcons(false); lucide.createIcons();
        }

        video.addEventListener('timeupdate', () => {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressFill.style.width = percent + '%';
                const f = (s) => { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m<10?'0':''}${m}:${sc<10?'0':''}${sc}`; };
                timeDisplay.innerText = `${f(video.currentTime)} / ${f(video.duration)}`;

                if (percent > 80 && activeDramaId) markEpisodeWatched(activeDramaId, currentEpIndex);
            }
        });

        function markEpisodeWatched(bookId, index) {
            if (!watchHistory[bookId]) {
                watchHistory[bookId] = { lastIdx: index, watched: [], title: document.getElementById('det-title').innerText, cover: document.getElementById('det-poster').src, total: totalChapters, isFinished: false };
            }
            if (!watchHistory[bookId].watched.includes(index)) {
                watchHistory[bookId].watched.push(index);
                watchHistory[bookId].lastIdx = index;
                watchHistory[bookId].total = totalChapters;
                if (index === totalChapters - 1) watchHistory[bookId].isFinished = true;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(watchHistory));
                updateEpisodeButtonsUI(); updateProgressBanner();
            } else {
                watchHistory[bookId].lastIdx = index;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(watchHistory));
            }
        }

        window.toggleFinishManual = () => {
            if (!activeDramaId || !watchHistory[activeDramaId]) return;
            watchHistory[activeDramaId].isFinished = !watchHistory[activeDramaId].isFinished;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(watchHistory));
            updateProgressBanner();
        };

        function updateEpisodeButtonsUI() {
            if (!activeDramaId || !watchHistory[activeDramaId]) return;
            const watched = watchHistory[activeDramaId].watched;
            document.querySelectorAll('.ep-btn').forEach((btn, i) => {
                const idx = i % totalChapters;
                if (watched.includes(idx)) btn.classList.add('watched');
            });
        }

        function updateProgressBanner() {
            const banner = document.getElementById('watch-progress-banner');
            const finishBtn = document.getElementById('btn-finish-manual');
            const finishText = document.getElementById('finish-status-text');
            const text = document.getElementById('watched-text');

            if (activeDramaId && watchHistory[activeDramaId]) {
                const count = watchHistory[activeDramaId].watched.length;
                const isFinished = watchHistory[activeDramaId].isFinished;
                text.innerText = isFinished ? `Selesai di Tonton` : `${count}/${totalChapters}`;
                banner.style.display = 'flex';
                banner.style.color = isFinished ? 'var(--success)' : 'var(--primary)';
                banner.style.borderColor = isFinished ? 'var(--success)' : 'var(--primary)';
                
                finishBtn.style.display = 'flex';
                finishText.innerText = isFinished ? "Sudah Selesai di Tonton" : "Tandai Selesai";
                finishBtn.style.background = isFinished ? "var(--success)" : "rgba(16, 185, 129, 0.1)";
                finishBtn.style.color = isFinished ? "white" : "var(--success)";
            } else {
                banner.style.display = 'none'; finishBtn.style.display = 'none';
            }
        }

        document.getElementById('progress-container').onclick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.pageX - rect.left) / rect.width;
            if (video.duration) video.currentTime = pos * video.duration;
        };

        document.getElementById('full-btn').onclick = () => {
            playerMain.classList.toggle('fullscreen');
            const icon = playerMain.classList.contains('fullscreen') ? 'minimize' : 'maximize';
            document.getElementById('full-btn').innerHTML = `<i data-lucide="${icon}"></i>`;
            lucide.createIcons();
            if(playerMain.classList.contains('fullscreen')) window.scrollTo(0,0);
        };

        playerMain.onclick = (e) => {
            if (e.target.closest('button') || e.target.closest('.progress-bar-container')) return;
            if (video.paused) video.play().catch(()=>{}); else video.pause();
            playerMain.classList.toggle('playing', !video.paused);
            updatePlayIcons(!video.paused); showUI();
        };

        document.getElementById('main-play-btn').onclick = () => {
            if (video.paused) video.play().catch(()=>{}); else video.pause();
            playerMain.classList.toggle('playing', !video.paused);
            updatePlayIcons(!video.paused);
        };

        window.playEpisode = async (index) => {
            if (index < 0 || index >= totalChapters || !activeDramaId) return;
            currentEpIndex = index;
            const status = document.getElementById('player-status');
            document.querySelectorAll('.ep-btn').forEach((b, i) => b.classList.toggle('active', (i % totalChapters) === index));
            document.getElementById('prev-btn-ctrl').disabled = (index === 0);
            document.getElementById('next-btn-ctrl').disabled = (index === totalChapters - 1);
            status.innerText = `MEMUAT EPS ${index + 1}...`;
            video.pause();

            try {
                const res = await fetch(`${API_URL}/watch/${activeDramaId}/${index}`).then(r => r.json());
                const source = res.playUrl || res.videoUrl || res.url || (res.data && (res.data.playUrl || res.data.videoUrl));
                if (source) {
                    video.src = source; video.load();
                    video.oncanplay = () => {
                        video.oncanplay = null;
                        if (!activeDramaId) return;
                        video.style.display = 'block'; centerUI.style.display = 'none';
                        video.play().then(() => { playerMain.classList.add('playing'); updatePlayIcons(true); }).catch(() => {});
                    };
                } else status.innerText = "GAGAL DIMUAT";
            } catch (err) { status.innerText = "NETWORK ERROR"; }
        };

        window.nextEpisode = () => { if (currentEpIndex < totalChapters - 1) window.playEpisode(currentEpIndex + 1); };
        window.prevEpisode = () => { if (currentEpIndex > 0) window.playEpisode(currentEpIndex - 1); };
        video.onended = () => window.nextEpisode();

        window.closeDetail = () => {
            activeDramaId = null; resetPlayer();
            document.getElementById('list-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            window.scrollTo(0, 0);
        };

        window.openDrama = async (id, initialData) => {
            if (!id) return;
            activeDramaId = id; currentEpIndex = -1; totalChapters = 0;
            resetPlayer();

            if (initialData) {
                renderUI(initialData);
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('detail-view').style.display = 'block';
                window.scrollTo(0, 0);
            }

            try {
                const res = await fetch(`${API_URL}/detail/${id}`).then(r => r.json());
                const book = res.data?.book || res.book || res.data || res;
                if (activeDramaId === id && book) {
                    renderUI(book);
                    totalChapters = book.chapterCount || initialData?.chapterCount || 0;
                    generateButtons(); updateEpisodeButtonsUI(); updateProgressBanner();

                    const history = watchHistory[id];
                    let startIdx = 0;
                    if (history) {
                        startIdx = history.lastIdx !== undefined ? history.lastIdx : 0;
                        if (history.watched.includes(startIdx) && (startIdx + 1 < totalChapters)) startIdx++;
                    }
                    if (totalChapters > 0) {
                        window.playEpisode(startIdx);
                        playerMain.classList.add('fullscreen');
                    }
                }
            } catch (e) { console.error(e); }
        };

        function renderUI(b) {
            const book = b.book || b;
            document.getElementById('det-title').innerText = book.bookName || book.title || 'Drama';
            document.getElementById('player-drama-title').innerText = book.bookName || book.title || 'Drama';
            document.getElementById('det-poster').src = book.cover || book.coverWap || book.image || '';
            document.getElementById('det-rating').innerText = book.rankVo?.hotCode || book.playCount || '9.8';
            document.getElementById('det-ep-count').innerText = book.chapterCount || '??';
            document.getElementById('det-synopsis').innerText = book.introduction || book.intro || 'Sinopsis segera hadir.';
            lucide.createIcons();
        }

        function generateButtons() {
            const gridD = document.getElementById('ep-grid');
            const gridM = document.getElementById('ep-grid-mobile');
            gridD.innerHTML = ""; gridM.innerHTML = "";
            const fragD = document.createDocumentFragment();
            const fragM = document.createDocumentFragment();
            for (let i = 0; i < totalChapters; i++) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn'; btn.innerHTML = `${i + 1} <div class="check-mark"><i data-lucide="check" style="width:11px;height:11px;stroke-width:4"></i></div>`;
                btn.onclick = () => window.playEpisode(i);
                const btnM = btn.cloneNode(true);
                btnM.onclick = () => { window.playEpisode(i); window.closeEpPopup(); };
                fragD.appendChild(btn); fragM.appendChild(btnM);
            }
            gridD.appendChild(fragD); gridM.appendChild(fragM);
            lucide.createIcons();
        }

        window.showHistory = (el, filterFinished = false) => {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if(el) el.classList.add('active');
            document.getElementById('view-label').innerText = filterFinished ? "DRAMA TAMAT" : "RIWAYAT NONTON";
            window.closeDetail();
            window.closeSidebar(); // Auto-close on click
            
            const historyList = Object.keys(watchHistory)
                .filter(id => filterFinished ? watchHistory[id].isFinished : !watchHistory[id].isFinished)
                .map(id => ({ bookId: id, bookName: watchHistory[id].title, cover: watchHistory[id].cover, chapterCount: watchHistory[id].total }))
                .reverse();
            window.renderGrid(historyList);
        };

        // FIXED ENDPOINT EXTRACTOR (Robust)
        function extractDataArray(json) {
            if (!json) return [];
            if (Array.isArray(json)) return json;
            const d = json.data || json;
            if (d.records && Array.isArray(d.records)) return d.records;
            if (d.list && Array.isArray(d.list)) return d.list;
            if (d.newTheaterList && d.newTheaterList.records) return d.newTheaterList.records;
            if (d.recommendList && d.recommendList.records) return d.recommendList.records;
            if (d.theaterList && d.theaterList.records) return d.theaterList.records;
            if (Array.isArray(d)) return d;
            return Object.values(d).find(val => Array.isArray(val)) || [];
        }

        window.renderGrid = (list) => {
            const grid = document.getElementById('drama-grid');
            grid.innerHTML = "";
            if (!list || list.length === 0) { grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:#555; padding:50px 0;'>Daftar kosong.</p>"; return; }
            list.forEach(item => {
                const id = item.bookId || item.id;
                if(!id) return;
                const card = document.createElement('div');
                card.className = 'drama-card';
                card.onclick = () => window.openDrama(id, item);
                let progHtml = "";
                if (watchHistory[id]) {
                    const h = watchHistory[id];
                    const label = h.isFinished ? "TAMAT" : `${h.watched.length}/${item.chapterCount || h.total}`;
                    progHtml = `<div class="progress-badge" style="${h.isFinished ? 'background:var(--success); box-shadow:0 8px 20px rgba(16,185,129,0.5)' : ''}">${label}</div>`;
                }
                card.innerHTML = `
                    <div class="card-image-container">
                        <img src="${item.cover || item.coverWap || item.image || ''}" class="card-img" loading="lazy">
                        <div class="rating-badge"><i data-lucide="star" style="width:11px; height:11px; fill:currentColor"></i> ${item.rankVo?.hotCode || item.playCount || '9.0'}</div>
                        ${progHtml}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${item.bookName || item.title || 'Drama'}</div>
                        <div class="card-info"><i data-lucide="play-circle" style="width:10px; color:var(--primary);"></i> ${item.chapterCount || '??'} EPS • HD</div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        };

        window.changeSection = async (cat, el) => {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if(el) el.classList.add('active');
            document.getElementById('view-label').innerText = cat.toUpperCase();
            window.closeDetail(); 
            window.closeSidebar(); // Auto-close on click
            window.setLoader(true);
            try {
                const res = await fetch(`${API_URL}/${cat}`).then(r => r.json());
                window.renderGrid(extractDataArray(res));
            } catch(e) { window.renderGrid([]); } finally { window.setLoader(false); }
        };

        window.handleSearch = async (e) => {
            e.preventDefault();
            const q = document.getElementById('searchInput').value;
            if (!q) return;
            window.setLoader(true);
            try {
                const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}&lang=id`).then(r => r.json());
                window.renderGrid(extractDataArray(res));
                document.getElementById('view-label').innerText = `HASIL: ${q.toUpperCase()}`;
                window.closeDetail();
                window.closeSidebar();
            } finally { window.setLoader(false); }
        };

        window.onload = () => window.changeSection('home', document.querySelector('.menu-item'));
    </script>
</body>
</html>
